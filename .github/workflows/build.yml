name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned ipa
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Inspect project
        run: |
          {
            echo "### Xcode version"
            xcodebuild -version
            echo "### Schemes and targets"
            xcodebuild -list -project PickupCode-v2/PickupCode/PickupCode.xcodeproj
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PickupCode-v2/PickupCode/PickupCode.xcodeproj \
            -scheme PickupCode \
            -destination 'generic/platform=iOS' \
            -archivePath build/PickupCode.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || {
              echo "### Build failed - last 100 lines of log" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }

      - name: Package unsigned ipa
        run: |
          mkdir -p build/Payload
          cp -R "build/PickupCode.xcarchive/Products/Applications/PickupCode.app" build/Payload/
          cd build
          zip -qry PickupCode-unsigned.ipa Payload
          ls -lh PickupCode-unsigned.ipa

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: PickupCode-unsigned-ipa
          path: build/PickupCode-unsigned.ipa
