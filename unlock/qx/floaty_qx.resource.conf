# 一条正则覆盖 RevenueCat 三种权益接口：
#   /v1/subscribers/<id>      新版 SubscriberResponse（Pro 判定入口）
#   /v1/customer/<id>         旧版 CustomerInfo
#   /v1/subscribers[?query]   注册流程 POST（无尾斜杠）
#
# 尾部 (\/|\?|$) 是关键：QX 匹配的是「带 query string 的整条 URL」，
# 只写 /subscribers$ 的话 /subscribers?x=1 匹配不到 → 规则看着配了却不生效。
#
# 必须保证 **不能** 匹配 /v1/products 与 /v1/offerings，
# 否则付费页的套餐列表会显示不出来。
#
# 脚本 URL 用固定 commit（44a5c29）而不是 @main：
#   避免 jsdelivr 把旧的 @main 快照缓存住，导致改了代码但客户端拉到的还是旧版。
^https?:\/\/api\.revenuecat\.(com|biz)\/v1\/(subscribers|customer)(\/|\?|$) url script-response-body https://gcore.jsdelivr.net/gh/tangxl00/lingdongdao@44a5c29/unlock/qx/floaty_qx.js, requires-body=true, max-size=131072, tag=floaty-unlock
