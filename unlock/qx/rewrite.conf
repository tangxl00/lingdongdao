## ============================================================
## Floaty Unlock — Quantumult X 重写规则
##
## 用法：订阅 → 重写 → 右上角「+」→ 新建，把下面 [rewrite] 段整段粘进去
##       （或者在「资源」里用 remote 引用本文件）
##
## 前置条件（缺一不可）：
##   1. 设置 → HTTPS 解密 → 证书 → 生成并安装 → 在系统「设置→通用→关于本机→
##      证书信任设置」里**手动打开完全信任**
##   2. 设置 → HTTPS 解密 → 打开开关
##   3. [MITM] 段里 hostname 包含 api.revenuecat.com
##   4. 重写规则里 requires-body=true（否则 QX 不把响应体交给脚本）
## ============================================================

[MITM]
hostname = api.revenuecat.com, api.revenuecat.biz

[rewrite]
## ---------------------------------------------------------------------------
## 一条正则覆盖 RevenueCat 的三种权益接口，且**不会**误伤 /v1/products /v1/offerings
##
##   /v1/subscribers/<id>            新版 SubscriberResponse（Floaty 实际判定入口）
##   /v1/customer/<id>               旧版 CustomerInfo（老 SDK 走这个）
##   /v1/subscribers           (无尾斜杠，带或不带 query)  注册流程 POST
##
## 注意正则里 (\/|\?|$) 这一段：QX 的 url 匹配是**带 query string 的整条 URL**，
## 如果只写 /v1/subscribers$ 那么 /v1/subscribers?x=1 就匹配不到。
## ---------------------------------------------------------------------------
^https?:\/\/api\.revenuecat\.(com|biz)\/v1\/(subscribers|customer)(\/|\?|$) url script-response-body https://raw.githubusercontent.com/tangxl00/lingdongdao/main/unlock/qx/floaty_qx.js, requires-body=true, max-size=131072, tag=floaty-unlock
